<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fares Quiz Pro - 2025</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"/>

<style>
/* ─── CSS Variables ─────────────────────────────────────────── */
:root {
  --brand:      #8B5CF6; 
  --cyan:       #06B6D4; 
  --cyan-glass: rgba(6, 182, 212, 0.15);
  --dark-bg:    #0F172A; 
  --white:      #FFFFFF;
  --text-soft:  #94A3B8;
  --card-bg:    rgba(30, 41, 59, 0.75);
  --card-border:rgba(139, 92, 246, 0.3);
  --shadow-neon: 0 8px 32px rgba(6, 182, 212, 0.2);
  --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
  --font-main:  'Tajawal', 'Cairo', sans-serif;
}

/* ─── Reset & Base ──────────────────────────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-main);
  background: var(--dark-bg);
  color: var(--white);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed; inset: 0; z-index: -2;
  background: radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
              radial-gradient(circle at 80% 70%, rgba(6, 182, 212, 0.15) 0%, transparent 50%);
}

#progress-bar {
  position: fixed; top: 0; left: 0; right: 0; height: 5px;
  background: rgba(255,255,255,0.05); z-index: 1000;
}
#progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--brand), var(--cyan));
  width: 0%; transition: width 0.4s ease; box-shadow: 0 0 10px var(--cyan);
}

nav {
  position: fixed; top: 5px; left: 0; right: 0; z-index: 999;
  display: flex; align-items: center; justify-content: space-between;
  padding: 15px 30px; background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1);
}
  a{
            color: #B026FF;
             text-decoration: none;  

        }

.slide {
  display: none; min-height: 100vh; padding: 100px 20px 60px;
  animation: slideFade 0.5s ease both;
}
.slide.active { display: flex; flex-direction: column; align-items: center; }
@keyframes slideFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.glass-card {
  width: 100%; max-width: 820px; background: var(--card-bg);
  backdrop-filter: blur(20px); border: 1px solid var(--card-border);
  border-radius: 28px; padding: 45px; box-shadow: var(--shadow-neon);
}

.q-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 30px; line-height: 1.6; color: #fff; }
.options-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }

.option-btn {
  padding: 18px 25px; border-radius: 14px; border: 1.5px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.02); color: var(--white); cursor: pointer;
  font-family: var(--font-main); font-size: 1.15rem; transition: var(--transition);
  text-align: right; display: flex; align-items: center; gap: 15px;
}
.option-btn:hover:not(:disabled) { border-color: var(--cyan); background: var(--cyan-glass); transform: translateX(-6px); }
.option-btn.correct { border-color: #10B981 !important; background: rgba(16, 185, 129, 0.15) !important; color: #34D399 !important; font-weight: 700; }
.option-btn.wrong { border-color: #EF4444 !important; background: rgba(239, 68, 68, 0.15) !important; color: #F87171 !important; }

.feedback {
  margin-top: 25px; padding: 20px; border-radius: 12px; font-weight: 600; display: none;
  animation: fadeIn 0.4s ease; line-height: 1.6;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.btn-next {
  margin-top: 35px; padding: 16px 45px; border-radius: 50px; border: none;
  background: linear-gradient(135deg, var(--brand), var(--cyan));
  color: white; font-weight: 900; font-size: 1.2rem; cursor: pointer;
  transition: 0.3s; box-shadow: 0 6px 25px rgba(6, 182, 212, 0.4);
}
.btn-next:disabled { opacity: 0.2; cursor: not-allowed; filter: grayscale(1); }

.score-circle {
  width: 160px; height: 160px; border-radius: 50%; border: 8px solid var(--cyan);
  display: flex; align-items: center; justify-content: center; margin: 0 auto 25px;
  font-size: 2.5rem; font-weight: 900; color: var(--cyan); text-shadow: 0 0 15px var(--cyan);
}
.final-badge {
  background: var(--cyan-glass); color: var(--cyan); padding: 18px 30px;
  border-radius: 20px; border: 1.5px solid var(--cyan); margin-top: 25px;
  font-weight: 900; font-size: 1.3rem; display: inline-block;
}

#sync-overlay {
  display: none; position: fixed; inset: 0; z-index: 9999;
  background: rgba(15, 23, 42, 0.98); align-items: center; justify-content: center;
  flex-direction: column; gap: 20px;
}

@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="progress-bar"><div id="progress-fill"></div></div>

<nav>
  <div id="badge-name" style="background:var(--cyan-glass); padding:6px 18px; border-radius:30px; font-size:0.9rem; font-weight: 700;">بانتظار الاسم...</div>
<a href="res.html"><div id="badge-name" style="background:var(--cyan-glass); padding:6px 18px; border-radius:30px; font-size:0.9rem; font-weight: 700;">لوحة المفاعل</div>
</a>
 <div style="font-weight:900; font-size:1.3rem; color:var(--cyan);">Fares Quiz</div>
 
</nav>

<div id="slides-container">
  <div class="slide active" id="hero-slide">
    <div class="glass-card" style="text-align:center;">
      <div style="font-size:4.5rem; margin-bottom:25px;">🚀</div>
      <h1 style="margin-bottom:15px; font-weight:900;">اختبار زووم الشامل (40 سؤال)</h1>
      <p style="color:var(--text-soft); margin-bottom:35px;">هذا الاختبار يجمع كافة أسئلة نماذج امتحانات 2024-2025 بدقة تامة.</p>
      
      <div style="text-align:right; margin-bottom:25px;">
        <label style="display:block; margin-bottom:12px; font-weight:800;">اسم الطالب الثلاثي:</label>
        <input type="text" id="student-name" placeholder="أدخل اسمك هنا..." style="width:100%; padding:20px; border-radius:15px; border:2px solid rgba(255,255,255,0.1); background:rgba(0,0,0,0.3); color:white; font-size:1.2rem; outline:none; font-family: var(--font-main);">
      </div>
      
      <button class="btn-next" style="width:100%;" onclick="startQuiz()">ابدأ الاختبار الآن</button>
    </div>
  </div>

  <div id="quiz-slides"></div>

  <div class="slide" id="result-slide">
    <div class="glass-card" style="text-align:center;">
      <div id="score-emoji" style="font-size:4.5rem; margin-bottom:15px;">🏆</div>
      <h2 style="font-weight:900; margin-bottom:25px;">تهانينا! لقد انتهيت</h2>
      
      <div class="score-circle" id="final-score-view">0%</div>
      
      <p style="font-weight:700; color:var(--text-soft);">الطالب: <span id="res-name" style="color:white;"></span></p>
      
      <div class="final-badge">
        انت كده حليت كل نماذج امتحان 2024 - 2025
      </div>
      
      <p id="sync-msg" style="margin-top:25px; font-size:1rem; color:var(--cyan);">جاري إرسال النتيجة إلى Google Form...</p>
      
      <button class="btn-next" style="margin-top:45px; background:rgba(255,255,255,0.05); border:1.5px solid rgba(255,255,255,0.2);" onclick="location.reload()">إعادة الاختبار 🔄</button>
    </div>
  </div>
</div>

<div id="sync-overlay">
  <div style="width:60px; height:60px; border:6px solid rgba(255,255,255,0.1); border-top-color:var(--cyan); border-radius:50%; animation:spin 1s linear infinite;"></div>
  <p style="font-weight:800; color:white;">جاري حفظ النتيجة في النظام...</p>
</div>

<form id="google-form" action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSdzTYaGnHUyCOvhU2eVykhH6bLh_A9_AkiKJv2BzdmY0tKCLg/formResponse" method="POST" target="target_iframe" style="display:none;">

</form>

<script>
const quizData = [
  // نموذج 1 (data.js)
  {q:"تسمح النسخة المجانية من Zoom للمستخدمين بإجراء مؤتمرات الفيديو لعدد 100 مشارك بحد أقصى؟", opts:["صواب", "خطأ"], correct:0, fb:"أحسنت! النسخة المجانية تدعم حتى 100 مشارك."},
  {q:"برنامج Zoom عبارة عن منصة اتصال مرئي فقط ولا توجد به ميزات أخرى؟", opts:["صواب", "خطأ"], correct:1, fb:"خطأ، زووم يوفر الدردشة ومشاركة الشاشة والسبورة البيضاء."},
  {q:"ما هو الإجراء الأول الذي تقوم به لتحميل برنامج Zoom على جهاز الكمبيوتر الخاص بك؟", opts:["البحث في المتجر", "زيارة موقع Zoom الرسمي وتحميل الملف لتثبيته", "طلب الرابط من المسؤول", "تثبيت تطبيق أندرويد"], correct:1, fb:"زيارة الموقع الرسمي هي الخطوة الأهم والأضمن."},
  {q:"وقت الجلسة الواحدة في Zoom للنسخة المجانية (للاجتماعات الجماعية) هو؟", opts:["20 دقيقة", "30 دقيقة", "40 دقيقة", "60 دقيقة"], correct:2, fb:"صحيح، الجلسات المجانية محددة بـ 40 دقيقة."},
  {q:"يستخدم تطبيق Zoom من خلال أجهزة الكمبيوتر المكتبية فقط؟", opts:["صواب", "خطأ"], correct:1, fb:"خطأ، يتوفر على كافة الأجهزة الذكية."},
  {q:"كيف يمكن تسجيل الدخول لأول مرة في Zoom على الأجهزة المحمولة؟", opts:["إنشاء حساب جديد", "استخدام حساب جوجل", "استخدام حساب فيسبوك", "جميع الخيارات السابقة صحيحة"], correct:3, fb:"زووم يوفر طرق دخول متعددة ومرنة."},
  {q:"ما هو العنصر الأساسي الذي تحتاجه للانضمام إلى اجتماع أو محاضرة على Zoom؟", opts:["إيميل المضيف الشخصي", "رابط الاجتماع أو الـ ID", "رقم هاتف المنظم", "رصيد بنكي"], correct:1, fb:"الرابط أو الـ ID هما المطلوبان للدخول."},
  {q:"أي من الخيارات التالية لا يمكن تعديله في إعدادات الصفحة الشخصية للمستخدم؟", opts:["صورة الملف الشخصي", "اللغة المفضلة", "نوع الجهاز المستخدم", "اسم الظهور"], correct:2, fb:"نوع الجهاز يتم التعرف عليه تلقائياً ولا يغيره المستخدم."},
  {q:"أي مما يلي يعتبر خطوة مهمة لضمان نجاح البث المباشر للمحاضرة عبر Zoom؟", opts:["عدم الاهتمام بجودة الصوت", "التحضير الجيد للمحتوى وتجهيز المعدات", "عدم الرد على الأسئلة", "ترك الكاميرا مغلقة"], correct:1, fb:"التحضير الفني هو أساس نجاح البث."},
  {q:"يسمح زووم بمشاركة الشاشة (Screen Share) لجميع المشاركين إذا سمح المضيف؟", opts:["صواب", "خطأ"], correct:0, fb:"نعم، المضيف يملك صلاحية منح الإذن للآخرين بالمشاركة."},

  // نموذج 2 (data2.js)
  {q:"يمكن التسجيل في Zoom من خلال حساب الفيس بوك؟", opts:["صواب", "خطأ"], correct:0, fb:"نعم، الربط مع فيسبوك متاح."},
  {q:"بالضغط على زر Join في تطبيق zoom للأندرويد، يمكن دخول وحضور محاضرة؟", opts:["صواب", "خطأ"], correct:0, fb:"صحيح، زر Join مخصص للدخول برقم الاجتماع."},
  {q:"يمكن مشاركة الشاشة من خلال الضغط على زر New Meeting مباشرة؟", opts:["صواب", "خطأ"], correct:1, fb:"خطأ، New Meeting يبدأ اجتماعاً أولاً."},
  {q:"من مميزات Zoom أنه لا يحتاج إلى حساب لحضور محاضرة أو اجتماع من خلاله؟", opts:["صواب", "خطأ"], correct:0, fb:"صحيح، الضيف يمكنه الدخول عبر الرابط فقط."},
  {q:"بالضغط على زر Schedule يمكن إنشاء اجتماع أو محاضرة مجدولة؟", opts:["صواب", "خطأ"], correct:0, fb:"نعم، الجدولة تتيح ترتيب مواعيد قادمة."},
  {q:"ما هو الفرق بين New Meeting و Schedule Meeting عند إنشاء اجتماع؟", opts:["لا يوجد فرق", "الأول فوري والثاني مستقبلي", "الثاني للمدفوع فقط", "الأول للصوت فقط"], correct:1, fb:"الأول يبدأ حالاً، والثاني يحدد موعداً لاحقاً."},
  {q:"كيف يمكنك تكرار اجتماع مجدول بشكل دوري؟", opts:["تفعيل خيار Recurring Meeting", "إعادة الجدول يدوياً", "لا توجد هذه الخاصية", "استخدام منبه خارجي"], correct:0, fb:"خيار Recurring Meeting يكرر الاجتماع تلقائياً."},
  {q:"ماذا يحدث إذا قمت بإنهاء مشاركة العرض التقديمي (Stop Share) بالخطأ؟", opts:["يغلق الاجتماع", "يعود الوضع لعرض الكاميرات", "تتجمد الشاشة", "يتم حظر المضيف"], correct:1, fb:"الاجتماع يستمر ولكن تتوقف الرؤية عن المحتوى المشترك."},
  {q:"من أهم الخيارات التي تمكنك من مشاركة صوت جهازك بوضوح أثناء المشاركة؟", opts:["رفع صوت اللابتوب", "تفعيل Share Sound في نافذة المشاركة", "استخدام ميكروفون خار", "لا يمكن مشاركة الصوت"], correct:1, fb:"Share Sound يضمن وصول صوت النظام للمشاركين."},
  {q:"أي من العناصر التالية لا يمكن إضافته إلى السبورة البيضاء التفاعلية؟", opts:["نصوص كتابية", "رسومات يدوية", "مقاطع فيديو مشغلة", "أشكال هندسية"], correct:2, fb:"السبورة لا تدعم تشغيل الفيديوهات بداخلها كعنصر تفاعلي."},

  // نموذج 3 (data3.js)
  {q:"يمكن التحكم في ميكروفونات المشاركين من قبل المضيف (Host)؟", opts:["صواب", "خطأ"], correct:0, fb:"المضيف يملك صلاحية كتم أو فتح الصوت للمشاركين."},
  {q:"خاصية الغرف الفرعية (Breakout Rooms) تستخدم لتقسيم المشاركين لمجموعات عمل صغيرة؟", opts:["صواب", "خطأ"], correct:0, fb:"صحيح، وهي مثالية لورش العمل."},
  {q:"هل يوفر زووم إمكانية تسجيل الاجتماعات (Record) في النسخة المجانية؟", opts:["نعم، على جهاز الكمبيوتر", "نعم، على السحابة", "لا يسمح", "فقط للصوت"], correct:0, fb:"التسجيل المحلي متاح في النسخة المجانية."},
  {q:"يمكن للمشارك 'رفع اليد' (Raise Hand) لجذب انتباه المضيف؟", opts:["صواب", "خطأ"], correct:0, fb:"نعم، وهي وسيلة منظمة لطلب المداخلة."},
  {q:"يسمح زووم بتغيير الخلفية (Virtual Background) لإخفاء ما وراءك؟", opts:["صواب", "خطأ"], correct:0, fb:"صحيح، تتوفر هذه الميزة للحفاظ على الخصوصية."},
  {q:"هل يمكن للمضيف نقل صلاحية الإدارة (Host) لشخص آخر أثناء الاجتماع؟", opts:["نعم", "لا"], correct:0, fb:"يمكن نقل الصلاحية بسهولة من قائمة المشاركين."},
  {q:"تستخدم ميزة 'Waiting Room' للتحكم في من يدخل الاجتماع؟", opts:["صواب", "خطأ"], correct:0, fb:"صحيح، تتيح للمضيف مراجعة أسماء الداخلين."},
  {q:"أي من الأنظمة التالية يدعم تطبيق زووم بشكل رسمي؟", opts:["Windows", "Android", "iOS", "جميع ما سبق"], correct:3, fb:"زووم متاح على كافة أنظمة التشغيل الكبرى."},
  {q:"يمكن مشاركة ملفات مباشرة عبر الدردشة (Chat) في زووم؟", opts:["صواب", "خطأ"], correct:0, fb:"نعم، يمكن إرسال الملفات للمشاركين بسهولة."},
  {q:"هل يمكن استخدام زووم بدون تحميل البرنامج (عبر المتصفح)؟", opts:["نعم", "لا"], correct:0, fb:"نعم، عبر خيار Join from your browser."},

  {q:"ميزة 'Whiteboard' تسمح بالتعاون في الرسم والكتابة بين المشاركين؟", opts:["صواب", "خطأ"], correct:0, fb:"صحيح، إذا منح المضيف الإذن بذلك."},
  {q:"هل تتوفر ميزة 'ترجمة فورية' في النسخة الأساسية المجانية؟", opts:["نعم", "لا"], correct:1, fb:"الترجمة ميزة مخصصة للخطط المتقدمة."},
  {q:"الحد الأقصى لعدد المشاركين الذين تظهر صورهم في شاشة واحدة هو؟", opts:["9", "25", "49", "100"], correct:2, fb:"زووم يدعم عرض حتى 49 كاميرا في وقت واحد."},

  {q:"هل يستطيع المشارك تسجيل الاجتماع بدون إذن المضيف؟", opts:["نعم", "لا"], correct:1, fb:"التسجيل يتطلب موافقة أو إذن تقني من المضيف."},
  {q:"خيار 'Mute All' يساعد في السيطرة على الضوضاء أثناء المحاضرة؟", opts:["صواب", "خطأ"], correct:0, fb:"صحيح، أداة هامة للمحاضرين."},
  {q:"هل يمكن استخدام زووم لإقامة ندوات لآلاف الأشخاص (Webinar)؟", opts:["نعم", "لا"], correct:0, fb:"نعم، الـ Webinars خدمة مدفوعة تدعم آلاف الحضور."},
  {q:"يتم تحديث برنامج زووم تلقائياً لضمان الأمان؟", opts:["صواب", "خطأ"], correct:0, fb:"نعم، التحديثات الدورية ضرورية للأمان والاستقرار."},
  {q:"هل يمكن إجراء استطلاعات رأي (Polls) داخل الاجتماع؟", opts:["نعم", "لا"], correct:0, fb:"نعم، تتوفر في النسخ التعليمية والمدفوعة."},
  {q:"كلمة المرور للاجتماع (Passcode) تزيد من مستوى الأمان؟", opts:["صواب", "خطأ"], correct:0, fb:"صحيح، تمنع الدخول العشوائي وغير المرغوب فيه."}
];

let currentIdx = 0;
let score = 0;
let studentName = "";

function startQuiz() {
  const nameInp = document.getElementById('student-name');
  if (!nameInp || nameInp.value.trim().length < 3) {
    alert("يرجى إدخال اسمك الثلاثي كاملاً");
    return;
  }
  studentName = nameInp.value.trim();
  document.getElementById('badge-name').textContent = "👤 " + studentName;
  document.getElementById('hero-slide').classList.remove('active');
  renderQuestion();
}

function renderQuestion() {
  const container = document.getElementById('quiz-slides');
  container.innerHTML = "";
  
  const q = quizData[currentIdx];
  const slide = document.createElement('div');
  slide.className = "slide active";
  
  let optionsHtml = q.opts.map((opt, i) => `
    <button class="option-btn" onclick="handleAnswer(this, ${i})">
      <div style="width:22px; height:22px; border:2.5px solid currentColor; border-radius:50%; flex-shrink:0;"></div>
      ${opt}
    </button>
  `).join('');

  slide.innerHTML = `
    <div class="glass-card">
      <div style="display:flex; justify-content:space-between; margin-bottom:25px; align-items: center;">
        <span style="color:var(--cyan); font-weight:900;">سؤال ${currentIdx + 1} / 40</span>
        <span style="color:var(--text-soft);">${Math.round((currentIdx/40)*100)}%</span>
      </div>
      <h2 class="q-title">${q.q}</h2>
      <div class="options-grid">${optionsHtml}</div>
      <div id="fb-box" class="feedback"></div>
      <button id="next-btn" class="btn-next" style="width:100%; display:none;" onclick="goNext()">
        ${currentIdx === 39 ? 'عرض النتيجة النهائية ✨' : 'السؤال التالي ←'}
      </button>
    </div>
  `;
  container.appendChild(slide);
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function handleAnswer(btn, idx) {
  const q = quizData[currentIdx];
  const allBtns = document.querySelectorAll('.option-btn');
  const fb = document.getElementById('fb-box');
  
  allBtns.forEach(b => b.disabled = true);
  
  if (idx === q.correct) {
    btn.classList.add('correct');
    score++;
    fb.innerHTML = "✅ أحسنت! " + q.fb;
    fb.style.color = "#34D399";
    fb.style.background = "rgba(16, 185, 129, 0.1)";
    fb.style.border = "1px solid rgba(16, 185, 129, 0.3)";
  } else {
    btn.classList.add('wrong');
    allBtns[q.correct].classList.add('correct');
    fb.innerHTML = "❌ إجابة خاطئة. " + q.fb;
    fb.style.color = "#F87171";
    fb.style.background = "rgba(239, 68, 68, 0.1)";
    fb.style.border = "1px solid rgba(239, 68, 68, 0.3)";
  }
  
  fb.style.display = "block";
  document.getElementById('next-btn').style.display = "block";
}

function goNext() {
  currentIdx++;
  if (currentIdx < 40) {
    renderQuestion();
  } else {
    showResult();
  }
}

function updateProgress() {
  const pct = (currentIdx / 40) * 100;
  document.getElementById('progress-fill').style.width = pct + "%";
}

function showResult() {
  document.getElementById('quiz-slides').innerHTML = "";
  document.getElementById('result-slide').classList.add('active');
  
  const pct = Math.round((score / 40) * 100);
  document.getElementById('final-score-view').textContent = pct + "%";
  document.getElementById('res-name').textContent = studentName;
  
  let evaluation = pct >= 85 ? "ممتاز" : pct >= 75 ? "جيد جداً" : pct >= 60 ? "جيد" : "يحتاج تحسين";
  syncToGoogleForm(pct, evaluation);
}

function syncToGoogleForm(pct, evaluation) {
  document.getElementById('sync-overlay').style.display = "flex";
  document.getElementById('g-name').value = studentName;
  document.getElementById('g-score').value = score + " / 40";
  document.getElementById('g-pct').value = pct + "%";
  document.getElementById('g-eval').value = evaluation;
  document.getElementById('google-form').submit();
  
  setTimeout(() => {
    document.getElementById('sync-overlay').style.display = "none";
    document.getElementById('sync-msg').innerHTML = "✅ تم حفظ نتيجتك بنجاح في سجلات 2024-2025";
  }, 2500);
}
</script>
</body>
</html>
